version: 1.0.0
description: open source, decentralized, private alternative to apps like Discord or Slack
homepage: https://github.com/openconstruct/Peersuite
author: openconstruct
application:
  subdomain: peersuite
  background_task: true
  public_path:
    - /
  routes:
    - /=http://peersuite:80/
services:
  peersuite:
    # ghcr.io/openconstruct/peersuite:latest
    image: registry.lazycat.cloud/czyt/openconstruct/peersuite:1f8f1800c3f911d6

locales:
  zh:
    name: Peersuite
    description: 一个开源、去中心化、私有的应用程序，类似于 Discord 或 Slack 的替代品。
  en:
    name: Peersuite
    description: open source, decentralized, private alternative to apps like Discord or Slack
